<!-- Timezone-aware theme, applied before first paint to avoid a light-theme
     flash. Mirrors the logic in src/lib/theme.js — kept in sync manually
     since this must run standalone, before the app bundle loads. -->
<script>
(function () {
  try {
    var ov = sessionStorage.getItem('yc-theme-override');
    var theme;
    if (ov === 'light' || ov === 'dark') {
      theme = ov;
    } else {
      var h = new Date().getHours();
      theme = (h >= 19 || h < 7) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {}
})();
</script>
